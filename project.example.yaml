# 唯一用户配置：cp project.example.yaml field.yaml；./vins -c field.yaml run
# sensor=真实硬件；replay=离线播包（填写 dataset.bag，复用同段数据的标定）
# run.duration_s 为采集秒数；timeout_s 为整个任务上限，含启动/排空
# 标定是旧安装的初值，尚不代表新软件链的精度验收
schema_version: 1
board:
  target: firefly@192.168.1.51
  ssh_port: 22
  workspace: ~/vins-workspace
  identity_file: null
build:
  jobs: 4
paths:
  cache: cache
  build: build
  releases: releases
  experiments: experiments
run:
  mode: sensor
  name: field-vio
  timeout_s: 600
  startup_timeout_s: 30
  drain_timeout_s: 120
  shutdown_timeout_s: 15
  min_free_gib: 4
  duration_s: 60
dataset:
  bag: data/euroc/MH_01_easy.bag
  rate: 1.0
  start_s: 0
  duration_s: null
  ground_truth: null
inputs:
  camera:
    topic: /usb_camera/gray/image_raw
    expected_hz: 20.0
    encoding: mono8
    width: 512
    height: 512
    calibration:
      verified_for: flir-25162247-binning2-center512-historical
      model: PINHOLE
      distortion:
        k1: 0.044568
        k2: -0.038952
        p1: -0.000865
        p2: -4.4e-05
      projection:
        fx: 490.69074
        fy: 490.65532
        cx: 257.27195
        cy: 260.70489
    # SDK 仅开放以下实验参数，其余固定：Mono8、增益0、Gamma关闭、黑电平0、无抽样
    device:
      serial: '25162247'
      binning: 2                 # 1=不合并，2=2×2；改变后须重新核对标定
      # 合并后的原图上 [x,y,width,height]；默认中心512×512，再匹配上方输出尺寸
      crop:
      - 256
      - 128
      - 512
      - 512
      trigger: hardware          # hardware=IMU→Line0，software=SDK定时软触发，continuous=自由运行
      fps: 20.0                  # 只控制 software/continuous；hardware 由 IMU 实际脉冲决定
      exposure:
        mode: auto               # auto=自动曝光，manual=固定曝光
        time_us: 10000.0         # manual 生效，微秒
        auto_max_us: 20000.0     # auto 生效，限制运动拖影，微秒
  imu:
    enabled: true
    topic: /gnw_imu/data
    expected_hz: 100.0
    acceleration_unit: m/s^2
    angular_velocity_unit: rad/s
    device:
      port: /dev/ttyS7
      baud: 115200
      nominal_hz: 200
      raw_topic: /gnw_imu/serial_raw
vins:
  multiple_thread: 1
  max_cnt: 150
  min_dist: 30
  F_threshold: 1.0
  show_track: 1
  flow_back: 1
  max_solver_time: 0.08          # 秒
  max_num_iterations: 10
  keyframe_parallax: 10.0
  acc_n: 0.30624429
  gyr_n: 0.0076976367516
  acc_w: 2.16072167e-05
  gyr_w: 6.43825076e-07
  g_norm: 9.81007
  estimate_extrinsic: 1
  body_T_cam0:
  - - -0.9995259778949446
    - 0.030493264351484684
    - -0.004240323377392647
    - -0.009224791523835678
  - - 0.0034853556686375887
    - -0.024769179444511607
    - -0.9996871210761437
    - -0.023804613937617278
  - - -0.030588752982386926
    - -0.9992280263177348
    - 0.024651158434168114
    - -0.014649622967390382
  - - 0
    - 0
    - 0
    - 1
  estimate_td: 1
  td: 0.0                       # 秒，图像时间+td对应IMU时间
monitor:
  enabled: true
  refresh_s: 2.0
  first_message_timeout_s: 15.0
  input_stall_s: 5.0
  repeat_notice_s: 10.0
results:
  collect: true
  raw_logs: compressed
  raw_data: always              # always=自动收回bag；on_request=仅 pull --raw 时收回
recording:
  enabled: true
  split_mib: 512
